<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:24px;font-weight:700}.l{font-size:14px}.axis{stroke:#9ca3af;stroke-width:1}.ridge{fill:none;stroke:#2563eb;stroke-width:4}.all{fill:none;stroke:#ef4444;stroke-width:3}.none{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:7 6}</style><rect width="900" height="430" fill="white"/><text x="35" y="42" class="t">Decision-curve summary at pre-specified thresholds</text><line x1="90" y1="340" x2="850" y2="340" class="axis"/><line x1="90" y1="75" x2="90" y2="340" class="axis"/><line x1="90" y1="168" x2="850" y2="168" class="none"/><text x="35" y="173" class="l">0.00</text><polyline points="190,105 390,130 590,140 790,154" class="ridge"/><polyline points="190,139 390,207 590,282 790,365" class="all"/><polyline points="190,168 390,168 590,168 790,168" class="none"/><circle cx="190" cy="105" r="5" fill="#2563eb"/><circle cx="390" cy="130" r="5" fill="#2563eb"/><circle cx="590" cy="140" r="5" fill="#2563eb"/><circle cx="790" cy="154" r="5" fill="#2563eb"/><text x="178" y="370" class="l">5%</text><text x="376" y="370" class="l">10%</text><text x="576" y="370" class="l">15%</text><text x="776" y="370" class="l">20%</text><text x="350" y="405" class="l">Risk threshold</text><text x="650" y="85" class="l">Ridge model</text><line x1="615" y1="80" x2="645" y2="80" class="ridge"/><text x="650" y="108" class="l">Treat all</text><line x1="615" y1="103" x2="645" y2="103" class="all"/><text x="650" y="131" class="l">Treat none</text><line x1="615" y1="126" x2="645" y2="126" class="none"/><text x="100" y="92" class="l">Net benefit</text></svg>