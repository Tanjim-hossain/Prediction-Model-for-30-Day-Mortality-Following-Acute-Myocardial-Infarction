<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:24px;font-weight:700}.l{font-size:14px}.v{font-size:13px;font-weight:700}</style><rect width="900" height="500" fill="white"/><text x="35" y="40" class="t">Outer-fold permutation importance — final ridge model</text><text x="35" y="68" class="l">Importance = mean increase in held-out log loss after permuting one raw predictor</text><g><text x="35" y="112" class="l">Age</text><rect x="260" y="94" width="520" height="22" fill="#2563eb"/><text x="790" y="111" class="v">0.02714</text><text x="35" y="150" class="l">Killip class</text><rect x="260" y="132" width="169" height="22" fill="#60a5fa"/><text x="439" y="149" class="v">0.00881</text><text x="35" y="188" class="l">Heart-rate indicator</text><rect x="260" y="170" width="101" height="22" fill="#60a5fa"/><text x="371" y="187" class="v">0.00524</text><text x="35" y="226" class="l">Time to relief</text><rect x="260" y="208" width="52" height="22" fill="#93c5fd"/><text x="322" y="225" class="v">0.00268</text><text x="35" y="264" class="l">Weight</text><rect x="260" y="246" width="50" height="22" fill="#93c5fd"/><text x="320" y="263" class="v">0.00259</text><text x="35" y="302" class="l">Previous MI</text><rect x="260" y="284" width="33" height="22" fill="#bfdbfe"/><text x="303" y="301" class="v">0.00171</text><text x="35" y="340" class="l">Anterior infarct location</text><rect x="260" y="322" width="26" height="22" fill="#bfdbfe"/><text x="296" y="339" class="v">0.00134</text><text x="35" y="378" class="l">Gender</text><rect x="260" y="360" width="19" height="22" fill="#bfdbfe"/><text x="289" y="377" class="v">0.00100</text><text x="35" y="416" class="l">Height</text><rect x="260" y="398" width="8" height="22" fill="#dbeafe"/><text x="278" y="415" class="v">0.00041</text><text x="35" y="454" class="l">Hypotension</text><rect x="260" y="436" width="6" height="22" fill="#dbeafe"/><text x="276" y="453" class="v">0.00031</text></g><text x="260" y="487" class="l">Higher values indicate greater loss of predictive information when permuted.</text></svg>