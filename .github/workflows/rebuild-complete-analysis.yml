name: Rebuild complete analysis artifacts

on:
  push:
    branches:
      - restore-complete-analysis
    paths:
      - '_payload/full_notebook/part_16.txt'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: restore-complete-analysis
          fetch-depth: 0

      - name: Restore complete executed notebook and original figures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p notebooks results/figures
          cat _payload/full_notebook/part_*.txt | base64 -d > /tmp/full_notebook.xz
          xz -t /tmp/full_notebook.xz
          xz -dc /tmp/full_notebook.xz > notebooks/01_Complete_Executed_Analysis.ipynb

          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          path = Path('notebooks/01_Complete_Executed_Analysis.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))

          n_cells = len(nb['cells'])
          n_code = sum(cell.get('cell_type') == 'code' for cell in nb['cells'])
          n_executed = sum(
              cell.get('cell_type') == 'code' and cell.get('execution_count') is not None
              for cell in nb['cells']
          )
          n_outputs = sum(len(cell.get('outputs', [])) for cell in nb['cells'])
          assert (n_cells, n_code, n_executed, n_outputs) == (72, 32, 32, 126), (
              n_cells, n_code, n_executed, n_outputs
          )

          expected = {
              19: 'outcome_and_missingness.png',
              49: 'calibration_curve.png',
              66: 'decision_curve.png',
              68: 'permutation_importance.png',
          }
          for cell_index, filename in expected.items():
              image_payload = None
              for output in nb['cells'][cell_index].get('outputs', []):
                  payload = output.get('data', {}).get('image/png')
                  if payload is not None:
                      image_payload = ''.join(payload) if isinstance(payload, list) else payload
                      break
              if image_payload is None:
                  raise RuntimeError(f'No embedded PNG found in cell {cell_index}')
              Path('results/figures', filename).write_bytes(base64.b64decode(image_payload))

          print(
              f'Validated complete notebook: {n_cells} cells, '
              f'{n_executed}/{n_code} code cells executed, {n_outputs} outputs'
          )
          PY

          rm -f notebooks/01_Full_Analysis_Executed.ipynb
          rm -rf _payload _rebuild tools/notebook_payload
          rm -f .github/workflows/rebuild-complete-analysis.yml

      - name: Commit complete analytical record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete executed analysis and original figures"
          git push origin HEAD:restore-complete-analysis
