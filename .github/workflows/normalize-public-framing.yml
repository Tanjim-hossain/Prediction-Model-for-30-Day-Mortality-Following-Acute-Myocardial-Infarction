name: Normalize public project framing

on:
  push:
    branches:
      - complete-analysis-release
    paths:
      - '.github/workflows/normalize-public-framing.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: complete-analysis-release
          fetch-depth: 0

      - name: Update notebook header and pipeline docstring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('src/mortality_prediction_pipeline.py')
          source = source_path.read_text(encoding='utf-8')
          source = source.replace(
              'Reproducible ISDS Option A analysis pipeline.',
              'Reproducible 30-day mortality prediction pipeline.',
          )
          source = source.replace(
              'python src/isds_option_a_pipeline.py --data ami_patient_data.csv --output outputs/current',
              'python src/mortality_prediction_pipeline.py --data ami_patient_data.csv --output outputs/current',
          )
          source = source.replace(
              'The project is an academic/internal-validation exercise and is not a clinical tool.',
              'The model is internally validated only and is not a clinical decision tool.',
          )
          source_path.write_text(source, encoding='utf-8')

          notebook_path = Path('notebooks/01_Complete_Executed_Analysis.ipynb')
          nb = json.loads(notebook_path.read_text(encoding='utf-8'))

          before = {
              'cells': len(nb['cells']),
              'code_cells': sum(c.get('cell_type') == 'code' for c in nb['cells']),
              'executed_code_cells': sum(
                  c.get('cell_type') == 'code' and c.get('execution_count') is not None
                  for c in nb['cells']
              ),
              'outputs': sum(len(c.get('outputs', [])) for c in nb['cells']),
          }

          nb['cells'][0]['source'] = (
              '# 30-Day Mortality Prediction after Acute Myocardial Infarction\n'
              '## Complete executed analysis\n\n'
              '**Author:** Tanjim Hossain  \n'
              '**Execution environment:** Kaggle Notebook · Python 3.12.13 · scikit-learn 1.6.1  \n\n'
              'This notebook preserves the complete executed analytical record used to develop, compare, internally validate, interpret, and package a prediction model for 30-day mortality after acute myocardial infarction. All analytical code cells and executed outputs are retained. Preprocessing, hyperparameter tuning, class-imbalance experiments, and performance evaluation use leakage-safe internal-validation procedures.\n'
          )

          after = {
              'cells': len(nb['cells']),
              'code_cells': sum(c.get('cell_type') == 'code' for c in nb['cells']),
              'executed_code_cells': sum(
                  c.get('cell_type') == 'code' and c.get('execution_count') is not None
                  for c in nb['cells']
              ),
              'outputs': sum(len(c.get('outputs', [])) for c in nb['cells']),
          }
          assert before == after == {
              'cells': 72,
              'code_cells': 32,
              'executed_code_cells': 32,
              'outputs': 126,
          }

          notebook_path.write_text(
              json.dumps(nb, ensure_ascii=False, indent=1),
              encoding='utf-8',
          )
          PY

          python tools/audit_complete_notebook.py notebooks/01_Complete_Executed_Analysis.ipynb

      - name: Commit framing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mortality_prediction_pipeline.py notebooks/01_Complete_Executed_Analysis.ipynb
          git rm .github/workflows/normalize-public-framing.yml
          git commit -m "Remove course-specific public framing"
          git push origin HEAD:complete-analysis-release
