name: Extract original executed figures

on:
  push:
    branches:
      - complete-analysis-release
    paths:
      - '.github/workflows/extract-original-figures.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: complete-analysis-release
          fetch-depth: 0

      - name: Validate notebook and extract embedded figures
        run: |
          python tools/audit_complete_notebook.py \
            notebooks/01_Complete_Executed_Analysis.ipynb \
            --extract-figures results/figures

      - name: Commit original analysis figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figures
          git rm .github/workflows/extract-original-figures.yml
          git commit -m "Add original executed analysis figures"
          git push origin HEAD:complete-analysis-release
