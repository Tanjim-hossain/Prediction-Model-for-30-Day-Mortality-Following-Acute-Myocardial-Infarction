name: Clean notebook reporting language

on:
  push:
    branches:
      - complete-analysis-release
    paths:
      - '.github/workflows/cleanup-notebook-reporting-language.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: complete-analysis-release
          fetch-depth: 0

      - name: Replace course-specific reporting labels without changing analysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/01_Complete_Executed_Analysis.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))

          before = {
              'cells': len(nb['cells']),
              'code_cells': sum(c.get('cell_type') == 'code' for c in nb['cells']),
              'executed_code_cells': sum(c.get('cell_type') == 'code' and c.get('execution_count') is not None for c in nb['cells']),
              'outputs': sum(len(c.get('outputs', [])) for c in nb['cells']),
          }

          replacements = {
              'The report follows the official Option A requirements and uses TRIPOD elements 8-20 as a reporting guide.':
                  'The analysis uses TRIPOD-oriented reporting principles for transparent clinical prediction modelling.',
              'ISDS Option A - 30-day mortality prediction':
                  '30-day mortality prediction after acute myocardial infarction',
              'Assignment-compliance tracker': 'Project-completeness tracker',
              'assignment_compliance': 'project_completeness',
              'FINAL ASSIGNMENT-COMPLIANCE TRACKER': 'FINAL PROJECT COMPLETENESS TRACKER',
              'final_assignment_compliance_tracker.csv': 'final_project_completeness_tracker.csv',
              'The assignment provides no external validation dataset.':
                  'No external validation dataset was available in the supplied data package.',
              'Categories are fixed from the assignment data dictionary,':
                  'Categories are fixed from the supplied data dictionary,',
              'Assignment provides no externally established':
                  'The supplied data package provides no externally established',
              'Final reproducibility and assignment audit':
                  'Final reproducibility and project audit',
              'FINAL ASSIGNMENT COMPLIANCE': 'FINAL PROJECT COMPLETENESS',
          }

          def replace_text(value):
              if isinstance(value, list):
                  text = ''.join(value)
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  return text.splitlines(True)
              if isinstance(value, str):
                  for old, new in replacements.items():
                      value = value.replace(old, new)
              return value

          for cell in nb['cells']:
              cell['source'] = replace_text(cell.get('source', []))
              for output in cell.get('outputs', []):
                  if 'text' in output:
                      output['text'] = replace_text(output['text'])
                  data = output.get('data', {})
                  for key in list(data):
                      if key.startswith('text/'):
                          data[key] = replace_text(data[key])

          after = {
              'cells': len(nb['cells']),
              'code_cells': sum(c.get('cell_type') == 'code' for c in nb['cells']),
              'executed_code_cells': sum(c.get('cell_type') == 'code' and c.get('execution_count') is not None for c in nb['cells']),
              'outputs': sum(len(c.get('outputs', [])) for c in nb['cells']),
          }
          assert before == after == {
              'cells': 72,
              'code_cells': 32,
              'executed_code_cells': 32,
              'outputs': 126,
          }

          path.write_text(json.dumps(nb, ensure_ascii=False, indent=1), encoding='utf-8')
          PY

          python tools/audit_complete_notebook.py notebooks/01_Complete_Executed_Analysis.ipynb

      - name: Commit reporting-language cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/01_Complete_Executed_Analysis.ipynb
          git rm .github/workflows/cleanup-notebook-reporting-language.yml
          git commit -m "Use project-focused notebook reporting labels"
          git push origin HEAD:complete-analysis-release
